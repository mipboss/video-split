name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the exe to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller and YouTube upload libraries
        run: pip install pyinstaller google-api-python-client google-auth-oauthlib

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = Get-ChildItem ffmpeg-dl -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)\ffmpeg.exe", "$($bin.FullName)\ffprobe.exe" .

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name VideoSplitter `
            --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." `
            --collect-data googleapiclient `
            video_splitter.py

      - name: Check the exe was built
        shell: pwsh
        run: |
          $exe = Get-Item dist\VideoSplitter.exe
          "Built $($exe.Name): $([math]::Round($exe.Length / 1MB)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: VideoSplitter-windows
          path: dist/VideoSplitter.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoSplitter.exe
